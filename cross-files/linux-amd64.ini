[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'amd64'
endian = 'little'

[binaries]
c = ['clang']
cpp = ['clang++']
objc = ['clang']
objcpp = ['clang++']
nm = ['nm']
ar = ['ar']
strip = ['strip']
pkgconfig = ['pkg-config']

[built-in options]
c_args = ['-O2', '-g']
cpp_args = ['-O2', '-g', '-std=c++17']
